name: CE7 5m DEM inspection

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install GDAL
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin python3-gdal
      - name: Inspect and crop public 5 m DEM
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out
          URL='https://pgda.gsfc.nasa.gov/data/LOLA_5mpp/87S/ldem_87s_5mpp.tif'
          VSICURL="/vsicurl/${URL}"
          export CPL_VSIL_CURL_ALLOWED_EXTENSIONS='.tif'
          export GDAL_HTTP_MULTIRANGE='YES'
          export VSI_CACHE='TRUE'
          export VSI_CACHE_SIZE='50000000'
          gdalinfo -json "$VSICURL" > out/ldem_87s_5mpp.gdalinfo.json
          gdalinfo "$VSICURL" > out/ldem_87s_5mpp.gdalinfo.txt
          # Site projected in south-polar stereographic (R=1,737,400 m): x=30344.56, y=-20084.63.
          # Crop a 10 x 10 km validation window.
          gdal_translate -of GTiff -co TILED=YES -co COMPRESS=DEFLATE \
            -projwin 25344.5636 -15084.6285 35344.5636 -25084.6285 \
            "$VSICURL" out/ce7_5m_test_crop.tif
          gdalinfo -stats out/ce7_5m_test_crop.tif > out/ce7_5m_test_crop.gdalinfo.txt
          python3 - <<'PY'
          from osgeo import gdal, osr
          import json, math
          ds=gdal.Open('out/ce7_5m_test_crop.tif')
          gt=ds.GetGeoTransform(); b=ds.GetRasterBand(1)
          x,y=30344.56362155766,-20084.628521893053
          px=(x-gt[0])/gt[1]; py=(y-gt[3])/gt[5]
          ix,iy=int(math.floor(px)),int(math.floor(py))
          v=float(b.ReadAsArray(ix,iy,1,1)[0,0])
          info={'size':[ds.RasterXSize,ds.RasterYSize],'geotransform':gt,'site_pixel':[px,py],'site_value_m':v,'projection':ds.GetProjection()}
          open('out/site_sample.json','w').write(json.dumps(info,indent=2))
          print(json.dumps(info,indent=2))
          PY
          sha256sum out/* > out/sha256.txt
          du -h out/* | sort -h
      - uses: actions/upload-artifact@v4
        with:
          name: ce7-5m-inspection
          path: out
          if-no-files-found: error
          retention-days: 1
