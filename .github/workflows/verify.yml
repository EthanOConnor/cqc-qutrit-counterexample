name: CE7 artifact recovery

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch source mirrors and linked media
        shell: bash
        run: |
          set -u
          mkdir -p out
          fetch() {
            name="$1"
            url="$2"
            echo "Fetching $url"
            curl -A 'Mozilla/5.0' -L --connect-timeout 20 --max-time 90 -sS -D "out/${name}.headers" "$url" -o "out/$name" || true
            wc -c "out/$name" 2>/dev/null || true
          }
          fetch fxtwitter.json 'https://api.fxtwitter.com/SegerYU/status/2091250852568932449'
          fetch vxtwitter.json 'https://api.vxtwitter.com/SegerYU/status/2091250852568932449'
          fetch syndication.json 'https://cdn.syndication.twimg.com/tweet-result?id=2091250852568932449&lang=en'
          fetch oembed.json 'https://publish.twitter.com/oembed?url=https://twitter.com/SegerYU/status/2091250852568932449&omit_script=1'
          fetch twstalker_mickey.html 'https://ngntipkolamrenang.twstalker.com/mickeywzx'
          fetch twstalker_seger.html 'https://ngntipkolamrenang.twstalker.com/SegerYU'
          grep -RhoE 'https?[^"'"'"'<> ]+' out | sed 's#\\/#/#g' | grep -E 'pbs\.twimg\.com|video\.twimg\.com' | sort -u > out/media_urls.txt || true
          n=0
          while IFS= read -r url; do
            [ -n "$url" ] || continue
            url="${url%\\}"
            curl -A 'Mozilla/5.0' -L --connect-timeout 20 --max-time 120 -sS "$url" -o "out/media_${n}" || true
            file "out/media_${n}" >> out/media_files.txt || true
            printf '%s\t%s\n' "$n" "$url" >> out/media_map.tsv
            n=$((n+1))
          done < out/media_urls.txt
          find out -maxdepth 1 -type f -printf '%f %s bytes\n' | sort | tee out/listing.txt

      - name: Upload discovery files
        uses: actions/upload-artifact@v4
        with:
          name: ce7-discovery
          path: out
          if-no-files-found: error
          retention-days: 1
