name: Build extension note

on:
  push:
    branches:
      - agent/revise-extension-note
    paths:
      - "research/cqc-extensions-and-bounds.tex"
      - "research/cqc-extensions/**"
      - ".github/workflows/build-extension-note.yml"

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/revise-extension-note

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended

      - name: Build PDF twice
        run: |
          cd research
          pdflatex -interaction=nonstopmode -halt-on-error cqc-extensions-and-bounds.tex
          pdflatex -interaction=nonstopmode -halt-on-error cqc-extensions-and-bounds.tex

      - name: Commit rendered PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/cqc-extensions-and-bounds.pdf
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Build revised CQC extensions PDF"
          git push origin HEAD:${GITHUB_REF_NAME}
